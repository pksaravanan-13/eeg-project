paths:
  raw_data: data/raw
  processed_data: data/processed
  results: results
  figures: results/figures
  reports: results/reports

preprocessing:
  bandpass:
    l_freq: 1.0       # low cutoff Hz
    h_freq: 40.0      # high cutoff Hz
  notch_freq: 60.0    # power line noise Hz (US = 60, EU = 50)
  epoch_tmin: -0.2    # seconds before event
  epoch_tmax: 0.8     # seconds after event
  reject_threshold_uv: 150.0   # peak-to-peak amplitude rejection cutoff, in microvolts
  ica:
    n_components: 0.99 # fraction of explained variance -- self-adjusts to montage/rank, see src/preprocessing/ica.py docstring
    random_state: 42   # fixed seed -- reproducible decomposition run to run

analysis:
  frequency_bands:
    delta: [1, 4]
    theta: [4, 8]
    alpha: [8, 13]
    beta:  [13, 30]
    gamma: [30, 40]
  conditions:              # event tags compare_conditions averages separately -- see src/preprocessing/epoching.py's DEFAULT_EVENT_ID
    - auditory/left
    - auditory/right
    - visual/left
    - visual/right
  tfr_freq_min: 4
  tfr_freq_max: 40
  tfr_freq_step: 1
  topomap_times: [0.1, 0.2, 0.3]   # seconds post-event to snapshot in the topomap figure

classifier:
  cv_folds: 5           # cross-validation folds for decode_with_lda
  feature_fmin: 8.0     # mu band lower bound -- see src/analysis/classifier.py's extract_band_power_features docstring
  feature_fmax: 30.0    # beta band upper bound

subjects:
  - sub-01
